<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 노트</title>
<style>
  :root{
    --bg:#ffffff; --text:#37352f; --muted:#9b9a97; --line:#e9e9e7;
    --soft:#f7f6f3; --accent:#2383e2; --tag:#e3e2e0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:16px; line-height:1.65;
  }
  .page{max-width:720px; margin:0 auto; padding:48px 20px 96px}
  .icon{font-size:44px; line-height:1; margin-bottom:8px}
  h1{font-size:30px; line-height:1.25; margin:0 0 24px; font-weight:700; letter-spacing:-.02em}
  .field{margin:0 0 28px}
  .label{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--muted); font-weight:600; margin-bottom:6px;
  }
  .box{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    background:var(--soft); min-height:48px; outline:none; word-break:break-word;
  }
  .box:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(35,131,226,.12)}
  [contenteditable]:empty:before{content:attr(data-ph); color:#c4c3c0; pointer-events:none}
  .tag{display:inline-block; background:var(--tag); border-radius:4px; padding:2px 10px; font-size:15px}
  hr{border:0; border-top:1px solid var(--line); margin:32px 0}

  /* checklist */
  .todo{list-style:none; margin:0; padding:0}
  .todo li{display:flex; align-items:flex-start; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line)}
  .todo input[type=checkbox]{
    width:22px; height:22px; margin:2px 0 0; flex:none; accent-color:var(--accent); cursor:pointer;
  }
  .todo .t{flex:1; outline:none; min-height:28px; word-break:break-word}
  .todo li.done .t{color:var(--muted); text-decoration:line-through}
  .count{margin-left:auto; font-weight:500}

  /* log */
  .entry{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line)}
  .date{flex:none; width:84px; font-size:14px; color:var(--muted); font-weight:600; padding-top:2px}
  .entry .t{flex:1; outline:none; min-height:28px; word-break:break-word}
  .add{
    margin-top:14px; border:1px dashed #c9c8c5; background:none; color:var(--muted);
    padding:10px 14px; border-radius:8px; font:inherit; font-size:14px; cursor:pointer; width:100%;
  }
  .add:hover{background:var(--soft); color:var(--text)}

  @media (max-width:480px){
    .page{padding:32px 16px 72px}
    h1{font-size:26px}
    .date{width:68px; font-size:13px}
    .entry{gap:10px}
  }
</style>
</head>
<body>
<main class="page">
  <div class="icon">📝</div>
  <h1>기사 프로젝트 노트</h1>

  <section class="field">
    <div class="label">프로젝트 한 줄</div>
    <div class="box" id="brief" contenteditable="true" data-ph="프로젝트를 한 줄로 적어 주세요">브리프 한 줄</div>
  </section>

  <section class="field">
    <div class="label">주제</div>
    <div><span class="tag">경제</span></div>
  </section>

  <hr>

  <section class="field">
    <div class="label">할 일 체크리스트 <span class="count" id="count">0 / 5</span></div>
    <ul class="todo" id="todo"></ul>
  </section>

  <hr>

  <section class="field">
    <div class="label">날짜별 기록</div>
    <div id="log"></div>
    <button class="add" id="addDay" type="button">+ 다음 날짜 추가</button>
  </section>
</main>

<script>
(function(){
  var KEY = 'article-project-note-v1';
  var DAYS = ['일','월','화','수','목','금','토'];
  var state = { brief:'브리프 한 줄', todos:[], log:[] };

  // 초기값: 체크리스트 5개(빈 칸), 기록은 11/18 하루
  for (var i=0;i<5;i++) state.todos.push({done:false, text:''});
  state.log.push({date:'2026-11-18', text:''});

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.todos && saved.log) state = saved;
  } catch(e){}

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function fmt(iso){
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return (p[1]) + '/' + (p[2]) + ' (' + DAYS[d.getDay()] + ')';
  }
  function nextDay(iso){
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]+1);
    var m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }

  // 브리프
  var brief = document.getElementById('brief');
  brief.textContent = state.brief;
  brief.addEventListener('input', function(){ state.brief = brief.textContent; save(); });

  // 체크리스트
  var todo = document.getElementById('todo'), count = document.getElementById('count');
  function updateCount(){
    var n = state.todos.filter(function(t){return t.done}).length;
    count.textContent = n + ' / ' + state.todos.length;
  }
  function renderTodos(){
    todo.innerHTML = '';
    state.todos.forEach(function(t, idx){
      var li = document.createElement('li');
      if (t.done) li.className = 'done';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.addEventListener('change', function(){
        t.done = cb.checked; li.classList.toggle('done', t.done); updateCount(); save();
      });
      var tx = document.createElement('div');
      tx.className = 't'; tx.contentEditable = 'true';
      tx.setAttribute('data-ph', '할 일 ' + (idx+1));
      tx.textContent = t.text;
      tx.addEventListener('input', function(){ t.text = tx.textContent; save(); });
      li.appendChild(cb); li.appendChild(tx); todo.appendChild(li);
    });
    updateCount();
  }

  // 날짜별 기록
  var log = document.getElementById('log');
  function renderLog(){
    log.innerHTML = '';
    state.log.forEach(function(e){
      var row = document.createElement('div'); row.className = 'entry';
      var d = document.createElement('div'); d.className = 'date'; d.textContent = fmt(e.date);
      var tx = document.createElement('div');
      tx.className = 't'; tx.contentEditable = 'true';
      tx.setAttribute('data-ph', '오늘 한 줄');
      tx.textContent = e.text;
      tx.addEventListener('input', function(){ e.text = tx.textContent; save(); });
      row.appendChild(d); row.appendChild(tx); log.appendChild(row);
    });
  }
  document.getElementById('addDay').addEventListener('click', function(){
    var last = state.log[state.log.length-1].date;
    state.log.push({date: nextDay(last), text:''});
    save(); renderLog();
  });

  // 붙여넣기는 서식 없이 텍스트로, 엔터는 줄바꿈 대신 확정
  document.addEventListener('paste', function(ev){
    var el = ev.target;
    if (el && el.isContentEditable){
      ev.preventDefault();
      var txt = (ev.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g,' ');
      document.execCommand('insertText', false, txt);
    }
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && ev.target && ev.target.isContentEditable){
      ev.preventDefault(); ev.target.blur();
    }
  });

  renderTodos(); renderLog();
})();
</script>
</body>
</html>
